<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♡ 好き顔ランキング ♡</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #dff7ff 0%,
      #eefbff 45%,
      #f8fdff 100%
    );

  color:#17313a;
}

header{
  background:rgba(255,255,255,.88);
  padding:34px 16px 24px;
  text-align:center;
  border-bottom:1px solid rgba(100,190,215,.25);
  box-shadow:0 3px 18px rgba(60,160,190,.08);
}

h1{
  margin:0 0 8px;
  font-size:27px;
  font-weight:900;
  color:#15566a;
}

.sub{
  color:#6b8992;
  font-size:13px;
}

main{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:42px 18px 60px;
}

.panel{
  background:rgba(255,255,255,.94);
  border-radius:26px;
  padding:30px;
  margin:0 auto 24px;
  box-shadow:
    0 10px 35px rgba(55,150,180,.12);
  border:1px solid rgba(120,210,230,.22);
}

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}

h2{
  margin:8px 0 14px;
  color:#15566a;
}

button{
  border:0;
  border-radius:15px;
  padding:14px 20px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.primary{
  background:#58c7e5;
  color:white;
  box-shadow:0 5px 14px rgba(65,180,210,.25);
}

.primary:active{
  transform:scale(.98);
}

.secondary{
  background:#e5f7fc;
  color:#286476;
}

.info{
  color:#708991;
  font-size:13px;
  line-height:1.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:24px;
}

.photo{
  position:relative;
  border:4px solid transparent;
  border-radius:19px;
  overflow:hidden;
  background:#eafaff;
  padding:0;
  box-shadow:0 5px 15px rgba(50,150,180,.13);
  transition:.15s;
}

.photo.selected{
  border-color:#4bc3e2;
  transform:scale(.97);
  box-shadow:
    0 0 0 3px rgba(75,195,226,.14),
    0 7px 18px rgba(50,150,180,.18);
}

.photo img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

.photo .mark{
  position:absolute;
  right:8px;
  top:8px;
  width:31px;
  height:31px;
  border-radius:50%;
  background:#fff;
  color:#36afd0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:900;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.photo.selected .mark{
  display:flex;
}

.progress{
  height:8px;
  background:#e1f4f8;
  border-radius:99px;
  overflow:hidden;
  margin:16px 0 20px;
}

.bar{
  height:100%;
  background:linear-gradient(
    90deg,
    #83dff1,
    #42bddc
  );
  width:0;
  transition:.25s;
}

.league{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:24px;
}

.league button{
  padding:0;
  background:white;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(50,150,180,.13);
  border:3px solid transparent;
  transition:.15s;
}

.league button:active{
  transform:scale(.97);
  border-color:#58c7e5;
}

.league img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

.league .label{
  padding:13px 8px;
  color:#286476;
  background:#f5fcfe;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:24px;
}

.resultGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
  margin-top:24px;
}

.resultCard{
  background:#fff;
  border-radius:19px;
  border:1px solid #dff1f5;
  overflow:hidden;
  box-shadow:0 7px 20px rgba(50,150,180,.10);
}

.resultCard img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

.rankText{
  text-align:center;
  padding:12px 5px 14px;
  font-size:18px;
  font-weight:900;
  color:#23687a;
}

.top1{
  font-size:22px;
  font-weight:900;
  color:#15566a;
}

@media(max-width:600px){

  header{
    padding:27px 14px 20px;
  }

  h1{
    font-size:24px;
  }

  main{
    padding:30px 11px 45px;
  }

  .panel{
    padding:20px 14px 24px;
    border-radius:22px;
  }

  .grid{
    gap:8px;
    margin-top:20px;
  }

  .league{
    gap:8px;
    margin-top:20px;
  }

  .resultGrid{
    gap:8px;
  }

  .photo{
    border-radius:14px;
  }

  .league button{
    border-radius:14px;
  }

  .actions button{
    flex:1;
    min-width:120px;
  }
}

@media(min-width:601px){

  #home{
    padding-top:65px;
    padding-bottom:65px;
  }

}
</style>
</head>

<body>

<header>
  <h1>♡ 好き顔ランキング ♡</h1>
  <div class="sub">あなたが一番好きな顔を決めよう</div>
</header>

<main>

<!-- ホーム -->

<section id="home" class="panel center">

  <h2>好き顔ランキング</h2>

  <p class="info">
    写真の中から好きな顔を選んでください。<br>

  </p>

  <button class="primary" id="startButton">

  </button>

</section>


<!-- 予選 -->

<section id="qualify" class="panel hidden">

  </div>

  <div class="info">

  </div>

</section>


<!-- 予選通過リーグ -->

<section id="league" class="panel hidden">

  <b id="leagueTitle">

  </b>

  <p class="info">
    3枚の中から<strong>一番好きな1枚</strong>を選んでください。

  </div>

</section>

</main>


<script>

/* =========================
写真
========================= */

const PHOTO_FILES = [

"IMG_2717.jpeg",
"IMG_2718.jpeg",
"IMG_2719.jpeg",
"IMG_2720.jpeg",
"IMG_2722.jpeg",
"IMG_2723.jpeg",
"IMG_2724.jpeg",
"IMG_2725.jpeg",
"IMG_2726.jpeg",
"IMG_2727.jpeg",
"IMG_2729.jpeg",
"IMG_2730.jpeg",
"IMG_2731.jpeg",
"IMG_2732.jpeg",
"IMG_2733.jpeg",
"IMG_2734.jpeg",
"IMG_2735.jpeg",
"IMG_2736.jpeg",
"IMG_2737.jpeg",
"IMG_2738.jpeg",
"IMG_2739.jpeg",
"IMG_2740.jpeg",
"IMG_2741.jpeg",
"IMG_2742.jpeg",
"IMG_2743.jpeg",
"IMG_2744.jpeg",
"IMG_2745.jpeg",
"IMG_2746.jpeg",
"IMG_2747.jpeg",
"IMG_2748.jpeg",
"IMG_2749.jpeg",
"IMG_2750.jpeg",
"IMG_2751.jpeg",
"IMG_2752.jpeg",
"IMG_2753.jpeg",
"IMG_2754.jpeg",
"IMG_2755.jpeg",
"IMG_2756.jpeg",
"IMG_2757.jpeg",
"IMG_2758.jpeg",
"IMG_2759.jpeg",
"IMG_2760.jpeg",
"IMG_2762.jpeg",
"IMG_2763.jpeg",
"IMG_2764.jpeg",
"IMG_2765.jpeg",
"IMG_2766.jpeg",
"IMG_2767.jpeg",
"IMG_2768.jpeg",
"IMG_2769.jpeg",
"IMG_2770.jpeg"

];


/* =========================
状態
========================= */

const state = {

  photos: [],

  qualifyGroups: [],
  qualifyIndex: 0,
  qualifySelections: [],

  finalists: [],

  leagueIndex: 0,
  leagueHistory: [],

  wins: {},
  appearances: {},
  pairCounts: {},

  result: []

};


const $ = id =>
  document.getElementById(id);


/* =========================
シャッフル
========================= */

function shuffle(arr){

  const copy = [...arr];

  for(let i = copy.length - 1; i > 0; i--){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [copy[i],copy[j]] =
      [copy[j],copy[i]];

  }

  return copy;

}


/* =========================
写真読み込み
========================= */

function loadPhotos(){

  state.photos =
    PHOTO_FILES.map((file,index)=>({

      id:index,
      file:file,
      url:file

    }));

}


/* =========================
予選グループ
5～6枚
========================= */

function createQualifyGroups(){

  const shuffled =
    shuffle(state.photos);

  const groups = [];

  let index = 0;

  while(index < shuffled.length){

    const remaining =
      shuffled.length - index;

    let size;

    if(remaining <= 6){

      size = remaining;

      /*
       * 最後が4枚以下になりそうなら
       * 前のグループから移動
       */

      if(size < 5 && groups.length > 0){

        const last =
          groups[groups.length - 1];

        if(last.length > 5){

          const moved =
            last.pop();

          const group =
            shuffled.slice(
              index,
              index + size
            );

          group.push(moved);

          groups.push(group);

          index += size;

          continue;

        }

      }

    }else{

      size =
        Math.random() < 0.5
        ? 5
        : 6;

      /*
       * 残りが4枚にならないように調整
       */

      const after =
        remaining - size;

      if(after > 0 && after < 5){

        size = 5;

      }

    }

    groups.push(
      shuffled.slice(
        index,
        index + size
      )
    );

    index += size;

  }

  return groups;

}


/* =========================
予選開始
========================= */

function startQualify(){

  state.qualifyGroups =
    createQualifyGroups();

  state.qualifyIndex = 0;
  state.qualifySelections = [];
  state.finalists = [];

  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("league").classList.add("hidden");
  $("qualify").classList.remove("hidden");

  showQualify();

}


/* =========================
予選表示
========================= */

function showQualify(){

  const group =
    state.qualifyGroups[
      state.qualifyIndex
    ];

  if(!group){

    collectFinalists();
    startLeague();

    return;

  }

  $("qualifyTitle").textContent =
    `予選 ${state.qualifyIndex + 1} / ${state.qualifyGroups.length}`;

  $("qualifyBar").style.width =
    `${(state.qualifyIndex /
    state.qualifyGroups.length) * 100}%`;

  const saved =
    state.qualifySelections[
      state.qualifyIndex
    ] || [];

  $("qualifyGrid").innerHTML =

    group.map(p=>`

      <button
        class="photo ${saved.includes(p.id) ? "selected" : ""}"
        onclick="toggleSelect(${p.id})">

        <img src="${p.url}">

        <span class="mark">
          ✓
        </span>

      </button>

    `).join("");

}


/* =========================
予選選択
========================= */

window.toggleSelect =
function(id){

  if(!state.qualifySelections[
    state.qualifyIndex
  ]){

    state.qualifySelections[
      state.qualifyIndex
    ] = [];

  }

  const selected =
    state.qualifySelections[
      state.qualifyIndex
    ];

  if(selected.includes(id)){

    state.qualifySelections[
      state.qualifyIndex
    ] =
      selected.filter(
        x => x !== id
      );

  }else{

    selected.push(id);

  }

  showQualify();

};


/* =========================
予選 次へ
========================= */

$("qualifyNext")
.addEventListener(
  "click",
  ()=>{

    if(
      state.qualifyIndex <
      state.qualifyGroups.length - 1
    ){

      state.qualifyIndex++;

      showQualify();

    }else{

      collectFinalists();

      startLeague();

    }

  }
);


/* =========================
予選 戻る
========================= */

$("qualifyBack")
.addEventListener(
  "click",
  ()=>{

    if(state.qualifyIndex > 0){

      state.qualifyIndex--;

      showQualify();

    }else{

      $("qualify")
        .classList
        .add("hidden");

      $("home")
        .classList
        .remove("hidden");

    }

  }
);


/* =========================
予選通過者
========================= */

function collectFinalists(){

  const ids = [];

  state.qualifySelections
    .forEach(group=>{

      group.forEach(id=>{

        if(!ids.includes(id)){

          ids.push(id);

        }

      });

    });

  state.finalists =
    ids
    .map(id=>
      state.photos.find(
        p => p.id === id
      )
    )
    .filter(Boolean);

}


/* =========================
キー
========================= */

function pairKey(a,b){

  return [
    Math.min(a.id,b.id),
    Math.max(a.id,b.id)
  ].join("-");

}

function trioKey(group){

  return group
    .map(p=>p.id)
    .sort((a,b)=>a-b)
    .join("-");

}


/* =========================
リーグ初期化
========================= */

function initializeLeague(){

  state.leagueIndex = 0;
  state.leagueHistory = [];
  state.wins = {};
  state.appearances = {};
  state.pairCounts = {};

  state.finalists.forEach(p=>{

    state.wins[p.id] = 0;
    state.appearances[p.id] = 0;

  });

}


/* =========================
次の3枚
選択結果によって変化
========================= */

function createNextLeagueGroup(){

  const players =
    [...state.finalists];

  if(players.length <= 3){

    return shuffle(players);

  }


  function priority(p){

    const wins =
      state.wins[p.id] || 0;

    const appearances =
      state.appearances[p.id] || 0;

    return (
      100 / (appearances + 1) +
      20 / (wins + 1) +
      Math.random() * 10
    );

  }


  const candidates =
    [...players].sort(
      (a,b)=>
        priority(b)-priority(a)
    );


  const first =
    candidates[0];


  const secondCandidates =

    players
    .filter(
      p => p.id !== first.id
    )
    .sort((a,b)=>{

      const pairA =
        state.pairCounts[
          pairKey(first,a)
        ] || 0;

      const pairB =
        state.pairCounts[
          pairKey(first,b)
        ] || 0;

      if(pairA !== pairB){

        return pairA - pairB;

      }

      return (
        (state.wins[a.id] || 0) -
        (state.wins[b.id] || 0)
      );

    });


  const second =
    secondCandidates[0];


  const thirdCandidates =

    players
    .filter(
      p =>
        p.id !== first.id &&
        p.id !== second.id
    )
    .sort((a,b)=>{

      const scoreA =
        (state.pairCounts[
          pairKey(first,a)
        ] || 0) +
        (state.pairCounts[
          pairKey(second,a)
        ] || 0);

      const scoreB =
        (state.pairCounts[
          pairKey(first,b)
        ] || 0) +
        (state.pairCounts[
          pairKey(second,b)
        ] || 0);

      return scoreA - scoreB;

    });


  let group = [

    first,
    second,
    thirdCandidates[0]

  ];


  const previous =
    state.leagueHistory.map(
      h => h.trioKey
    );


  if(previous.includes(
    trioKey(group)
  )){

    const alternatives =
      shuffle(
        players.filter(
          p =>
            !group.some(
              x => x.id === p.id
            )
        )
      );

    for(const alt of alternatives){

      const test = [
        first,
        second,
        alt
      ];

      if(
        !previous.includes(
          trioKey(test)
        )
      ){

        group = test;

        break;

      }

    }

  }


  return shuffle(group);

}


/* =========================
リーグ開始
========================= */

function startLeague(){

  $("qualify")
    .classList
    .add("hidden");

  if(state.finalists.length === 0){

    showFinalResult([]);

    return;

  }


  if(state.finalists.length < 3){

    state.result =
      [...state.finalists];

    showFinalResult(
      state.result
    );

    return;

  }


  initializeLeague();

  $("league")
    .classList
    .remove("hidden");

  showLeague();

}


/* =========================
リーグ表示
========================= */

function showLeague(){

  /*
   * 選ばれた人数によって
   * 試行回数を変える
   */

  const totalRounds =
    Math.max(
      15,
      Math.min(
        45,
        state.finalists.length * 3
      )
    );


  if(
    state.leagueIndex >=
    totalRounds
  ){

    finishLeague();

    return;

  }


  let group;


  if(
    state.leagueHistory[
      state.leagueIndex
    ]
  ){

    group =
      state.leagueHistory[
        state.leagueIndex
      ].group;

  }else{

    group =
      createNextLeagueGroup();

  }


  $("leagueTitle").textContent =
    `予選通過リーグ ${state.leagueIndex + 1} / ${totalRounds}`;


  $("leagueBar").style.width =
    `${(state.leagueIndex / totalRounds) * 100}%`;


  $("leagueGrid").innerHTML =

    group.map(p=>`

      <button
        onclick="chooseLeague(${p.id})">

        <img src="${p.url}">

        <div class="label">
          選ぶ
        </div>

      </button>

    `).join("");

}


/* =========================
リーグ選択
========================= */

window.chooseLeague =
function(id){

  const oldHistory =
    state.leagueHistory[
      state.leagueIndex
    ];


  const group =
    oldHistory
    ? oldHistory.group
    : createNextLeagueGroup();


  group.forEach(p=>{

    state.appearances[p.id] =
      (state.appearances[p.id] || 0) + 1;

  });


  for(
    let i=0;
    i<group.length;
    i++
  ){

    for(
      let j=i+1;
      j<group.length;
      j++
    ){

      const key =
        pairKey(
          group[i],
          group[j]
        );

      state.pairCounts[key] =
        (state.pairCounts[key] || 0) + 1;

    }

  }


  state.wins[id] =
    (state.wins[id] || 0) + 1;


  state.leagueHistory[
    state.leagueIndex
  ] = {

    group:group,
    selectedId:id,
    trioKey:trioKey(group)

  };


  state.leagueIndex++;

  showLeague();

};


/* =========================
リーグ 戻る
========================= */

function undoLastLeagueRound(){

  if(
    state.leagueHistory.length === 0
  ){

    return;

  }


  const index =
    state.leagueHistory.length - 1;

  const last =
    state.leagueHistory[index];


  state.wins[
    last.selectedId
  ]--;


  last.group.forEach(p=>{

    state.appearances[p.id]--;

  });


  for(
    let i=0;
    i<last.group.length;
    i++
  ){

    for(
      let j=i+1;
      j<last.group.length;
      j++
    ){

      const key =
        pairKey(
          last.group[i],
          last.group[j]
        );

      state.pairCounts[key]--;

    }

  }


  state.leagueHistory.pop();

  state.leagueIndex = index;

}


$("leagueBack")
.addEventListener(
  "click",
  ()=>{

    if(
      state.leagueHistory.length === 0
    ){

      $("league")
        .classList
        .add("hidden");

      $("qualify")
        .classList
        .remove("hidden");

      state.qualifyIndex =
        state.qualifyGroups.length - 1;

      showQualify();

      return;

    }


    undoLastLeagueRound();

    showLeague();

  }
);


/* =========================
リーグ終了
========================= */

function finishLeague(){

  $("league")
    .classList
    .add("hidden");


  const sorted =
    [...state.finalists]
    .sort((a,b)=>{

      const winsA =
        state.wins[a.id] || 0;

      const winsB =
        state.wins[b.id] || 0;


      if(winsA !== winsB){

        return winsB - winsA;

      }


      const appA =
        state.appearances[a.id] || 1;

      const appB =
        state.appearances[b.id] || 1;


      const rateA =
        winsA / appA;

      const rateB =
        winsB / appB;


      if(rateA !== rateB){

        return rateB - rateA;

      }


      return Math.random() - .5;

    });


  state.result =
    sorted.slice(
      0,
      Math.min(
        9,
        sorted.length
      )
    );


  showFinalResult(
    state.result
  );

}


/* =========================
結果表示
========================= */

function showFinalResult(result){

  $("result")
    .classList
    .remove("hidden");


  $("ranking").innerHTML =

    result.map((p,i)=>{

      const rank =
        i + 1;


      return `

        <div class="resultCard">

          <img src="${p.url}">

          <div class="rankText">
            ${rank}位
          </div>

        </div>

      `;

    }).join("");


  if(result.length === 0){

    $("ranking").innerHTML = `

      <div
        style="
          grid-column:1/-1;
          text-align:center;
          padding:40px 20px;
        "
      >

        <b>
          今回は写真が選ばれませんでした
        </b>

        <p class="info">
          もう一度ランキングを開始してください。
        </p>

      </div>

    `;

  }

}


/* =========================
結果 → リーグ
========================= */

$("resultBack")
.addEventListener(
  "click",
  ()=>{

    if(
      state.finalists.length < 3
    ){

      return;

    }


    $("result")
      .classList
      .add("hidden");

    $("league")
      .classList
      .remove("hidden");


    if(
      state.leagueHistory.length > 0
    ){

      undoLastLeagueRound();

    }


    showLeague();

  }
);


/* =========================
もう一度
========================= */

$("retry")
.addEventListener(
  "click",
  ()=>{

    $("result")
      .classList
      .add("hidden");

    $("league")
      .classList
      .add("hidden");

    $("qualify")
      .classList
      .add("hidden");

    $("home")
      .classList
      .remove("hidden");

    loadPhotos();

  }
);


/* =========================
開始
========================= */

$("startButton")
.addEventListener(
  "click",
  ()=>{

    if(
      state.photos.length < 3
    ){

      alert(
        "写真を3枚以上登録してください。"
      );

      return;

    }

    startQualify();

  }
);


/* =========================
初期化
========================= */

loadPhotos();

</script>
